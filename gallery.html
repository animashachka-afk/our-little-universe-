<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Little Universe — Gallery</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    color: white;
    font-family: Georgia, serif;

    background:
        linear-gradient(rgba(10,8,16,.58), rgba(10,8,16,.72)),
        url("f203e7dc9bb9a1a5f0dd073a3895f298.jpg")
        center / cover fixed;

    padding: 35px 20px 70px;
}

.container {
    width: min(100%, 1000px);
    margin: auto;
}

.back {
    display: inline-block;
    color: rgba(255,255,255,.75);
    text-decoration: none;
    margin-bottom: 35px;
    font-size: 17px;
}

.title {
    text-align: center;
    margin-bottom: 30px;
}

.title .star {
    font-size: 25px;
    opacity: .8;
}

.title h1 {
    font-size: clamp(38px, 8vw, 65px);
    font-weight: 400;
    letter-spacing: 4px;
    margin: 10px 0;
}

.title p {
    font-size: 19px;
    opacity: .65;
    font-style: italic;
}

/* ADD PHOTO */

.add-photo {
    display: block;
    width: fit-content;
    margin: 0 auto 40px;

    padding: 13px 28px;

    border: 1px solid rgba(255,255,255,.35);
    border-radius: 999px;

    background: rgba(255,255,255,.08);
    color: white;

    font-family: Georgia, serif;
    font-size: 17px;

    cursor: pointer;
    transition: .3s;
}

.add-photo:hover {
    background: rgba(255,255,255,.17);
    transform: translateY(-2px);
}

#fileInput {
    display: none;
}

/* GALLERY */

.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.photo {
    position: relative;
    overflow: hidden;
    border-radius: 22px;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.05);

    aspect-ratio: 1 / 1;

    box-shadow:
        0 15px 40px rgba(0,0,0,.35);

    transition: .35s;
}

.photo:hover {
    transform: translateY(-5px);
}

.photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* DELETE BUTTON */

.delete {
    position: absolute;
    top: 12px;
    right: 12px;

    width: 38px;
    height: 38px;

    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.3);

    background: rgba(0,0,0,.55);
    color: white;

    font-size: 20px;
    cursor: pointer;

    opacity: 0;
    transition: .3s;
}

.photo:hover .delete {
    opacity: 1;
}

.delete:hover {
    background: rgba(255,70,90,.65);
}

/* VIEWER */

.viewer {
    position: fixed;
    inset: 0;

    background: rgba(5,4,9,.92);
    backdrop-filter: blur(12px);

    display: none;
    align-items: center;
    justify-content: center;

    padding: 25px;

    z-index: 1000;
}

.viewer.active {
    display: flex;
}

.viewer img {
    max-width: 95vw;
    max-height: 88vh;

    object-fit: contain;
    border-radius: 18px;

    box-shadow:
        0 20px 70px rgba(0,0,0,.7);
}

.close {
    position: fixed;
    top: 20px;
    right: 25px;

    width: 45px;
    height: 45px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.08);

    color: white;

    font-size: 25px;
    cursor: pointer;
}

@media (max-width: 600px) {

    .gallery {
        grid-template-columns: 1fr;
    }

    .photo {
        aspect-ratio: 4 / 5;
    }

    .delete {
        opacity: 1;
    }
}
</style>
</head>

<body>

<div class="container">

<a class="back" href="index.html">
    ← back to our universe
</a>

<div class="title">

    <div class="star">✦</div>

    <h1>our gallery</h1>

    <p>little pieces of our universe</p>

</div>

<button class="add-photo" onclick="document.getElementById('fileInput').click()">
    ＋ add photo
</button>

<input
    type="file"
    id="fileInput"
    accept="image/*"
    multiple
>

<div class="gallery" id="gallery">

    <!-- YOUR CURRENT PHOTOS -->

    <div class="photo" data-file-id="">
        <img src="https://ik.imagekit.io/kyokodiary/cf37bf94f2926915327cbc2c8b0bb29b%20(1).jpg?updatedAt=1786306364816">
        <button class="delete" onclick="deletePhoto(event, this)">
            ×
        </button>
    </div>

    <div class="photo" data-file-id="">
        <img src="https://ik.imagekit.io/kyokodiary/5e099f31f9ffc35686b2ca4cfe020a94.jpg?updatedAt=1786306364865">
        <button class="delete" onclick="deletePhoto(event, this)">
            ×
        </button>
    </div>

</div>

</div>

<!-- VIEWER -->

<div class="viewer" id="viewer" onclick="closePhoto(event)">

<button class="close" onclick="closePhoto()">
    ×
</button>

<img id="viewerImage">

</div>

<script>

const PUBLIC_KEY =
    "public_7Q1872goBuJHEKLx7/yLe7GbrOs=";

const fileInput =
    document.getElementById("fileInput");

const gallery =
    document.getElementById("gallery");


/* OPEN PHOTO */

gallery.addEventListener("click", function(event) {

    if (
        event.target.classList.contains("delete")
    ) {
        return;
    }

    const photo =
        event.target.closest(".photo");

    if (!photo) return;

    const image =
        photo.querySelector("img");

    document.getElementById("viewerImage").src =
        image.src;

    document.getElementById("viewer")
        .classList.add("active");

});


/* CLOSE PHOTO */

function closePhoto(event) {

    if (
        event &&
        event.target.id !== "viewer" &&
        !event.target.classList.contains("close")
    ) {
        return;
    }

    document.getElementById("viewer")
        .classList.remove("active");
}


document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {

        document.getElementById("viewer")
            .classList.remove("active");

    }

});


/* GET IMAGEKIT AUTH */

async function getAuth() {

    const authResponse = await fetch("/api/imagekit-auth");

if (!authResponse.ok) {
    throw new Error("Не удалось получить данные авторизации");
}

const auth = await authResponse.json();


/* ADD PHOTOS */

fileInput.addEventListener("change", async function() {

    const files =
        Array.from(fileInput.files);

    if (!files.length) return;

    try {

        const auth =
            await getAuth();

        for (const file of files) {

            const formData =
                new FormData();

            formData.append(
                "file",
                file
            );

            formData.append(
                "fileName",
                file.name
            );

            formData.append(
                "publicKey",
                PUBLIC_KEY
            );

            formData.append(
                "token",
                auth.token
            );

            formData.append(
                "expire",
                auth.expire
            );

            formData.append(
                "signature",
                auth.signature
            );

            formData.append(
                "folder",
                "/our-little-universe"
            );

            const response =
                await fetch(
                    "https://upload.imagekit.io/api/v1/files/upload",
                    {
                        method: "POST",
                        body: formData
                    }
                );

            const result =
                await response.json();

            if (!response.ok) {
                throw new Error(
                    result.message ||
                    "Upload failed"
                );
            }

            addPhotoToGallery(
                result.url,
                result.fileId
            );
        }

    } catch (error) {

        console.error(error);

        alert(
            "Не получилось загрузить фото 😭"
        );

    }

    fileInput.value = "";

});


/* ADD PHOTO TO PAGE */

function addPhotoToGallery(url, fileId) {

    const div =
        document.createElement("div");

    div.className = "photo";

    div.dataset.fileId =
        fileId;

    div.innerHTML = `
        <img src="${url}">
        <button class="delete"
                onclick="deletePhoto(event, this)">
            ×
        </button>
    `;

    gallery.prepend(div);
}


/* DELETE PHOTO */

async function deletePhoto(event, button) {

    event.stopPropagation();

    const photo =
        button.closest(".photo");

    const fileId =
        photo.dataset.fileId;

    if (!fileId) {

        alert(
            "Это старое фото. Его нужно удалить из ImageKit вручную."
        );

        return;
    }

    if (
        !confirm(
            "Удалить это фото?"
        )
    ) {
        return;
    }

    try {

        const response =
            await fetch(
                "/api/delete",
                {
                    method: "DELETE",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        fileId: fileId
                    })
                }
            );

        const result =
            await response.json();

        if (!response.ok) {

            throw new Error(
                result.error ||
                "Delete failed"
            );

        }

        photo.remove();

    } catch (error) {

        console.error(error);

        alert(
            "Не получилось удалить фото 😭"
        );

    }

}
    
</script>

</body>
</html>
