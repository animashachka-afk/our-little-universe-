<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Little Universe — Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    font-family:'Cormorant Garamond',serif;

    color:white;

    background:
        linear-gradient(
            rgba(0,0,0,.55),
            rgba(0,0,0,.75)
        ),
        url("03d713769f2fbfa58103415ec97e6b62.jpg")
        center/cover fixed;

    padding:40px 20px;

}


/* =========================
   HEADER
========================= */

.header{

    text-align:center;

    margin-bottom:35px;

}

.header h1{

    font-size:52px;

    font-weight:500;

    letter-spacing:4px;

    margin-bottom:10px;

}

.header p{

    font-size:21px;

    opacity:.75;

    font-style:italic;

}


/* =========================
   BUTTONS
========================= */

.buttons{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:15px;

    flex-wrap:wrap;

    margin-bottom:40px;

}

.button{

    display:inline-flex;

    justify-content:center;

    align-items:center;

    padding:14px 30px;

    border:1px solid rgba(255,255,255,.55);

    border-radius:999px;

    background:rgba(255,255,255,.06);

    color:white;

    font-family:inherit;

    font-size:20px;

    letter-spacing:2px;

    cursor:pointer;

    transition:.35s;

    backdrop-filter:blur(10px);

}

.button:hover{

    background:rgba(255,255,255,.16);

    transform:translateY(-3px);

}

input[type="file"]{

    display:none;

}


/* =========================
   GALLERY
========================= */

.gallery{

    width:100%;

    max-width:1100px;

    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(230px,1fr));

    gap:20px;

}


/* =========================
   PHOTO
========================= */

.photo{

    position:relative;

    overflow:hidden;

    border-radius:18px;

    background:rgba(255,255,255,.05);

    border:1px solid rgba(255,255,255,.15);

    aspect-ratio:1/1;

    animation:appear .6s ease;

}

.photo img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

    cursor:pointer;

    transition:.5s;

}

.photo:hover img{

    transform:scale(1.05);

}


/* =========================
   DELETE BUTTON
========================= */

.delete{

    position:absolute;

    top:10px;

    right:10px;

    width:36px;

    height:36px;

    border:none;

    border-radius:50%;

    background:rgba(0,0,0,.65);

    color:white;

    font-size:20px;

    cursor:pointer;

    z-index:5;

    backdrop-filter:blur(5px);

    transition:.3s;

}

.delete:hover{

    background:rgba(150,30,30,.85);

    transform:scale(1.1);

}


/* =========================
   VIEWER
========================= */

.viewer{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.92);

    display:none;

    justify-content:center;

    align-items:center;

    z-index:100;

    padding:20px;

}

.viewer.active{

    display:flex;

}

.viewer img{

    max-width:95vw;

    max-height:90vh;

    object-fit:contain;

    border-radius:10px;

    box-shadow:
        0 0 40px rgba(255,255,255,.12);

}

.close{

    position:absolute;

    top:20px;

    right:25px;

    width:45px;

    height:45px;

    border:none;

    border-radius:50%;

    background:rgba(255,255,255,.1);

    color:white;

    font-size:28px;

    cursor:pointer;

}


/* =========================
   EMPTY
========================= */

.empty{

    text-align:center;

    margin-top:80px;

    font-size:23px;

    opacity:.65;

}


/* =========================
   LOADING
========================= */

.loading{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.75);

    display:none;

    justify-content:center;

    align-items:center;

    z-index:200;

    font-size:25px;

    backdrop-filter:blur(5px);

}

.loading.active{

    display:flex;

}


/* =========================
   ANIMATION
========================= */

@keyframes appear{

    from{

        opacity:0;

        transform:translateY(20px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    body{

        padding:25px 14px;

    }

    .header h1{

        font-size:40px;

        letter-spacing:3px;

    }

    .header p{

        font-size:18px;

    }

    .gallery{

        grid-template-columns:
            repeat(2,1fr);

        gap:12px;

    }

    .button{

        font-size:18px;

        padding:12px 23px;

    }

}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <h1>our little universe</h1>

    <p>memories that belong only to us ♡</p>

</div>


<!-- BUTTONS -->

<div class="buttons">

    <label class="button">

        ⊕ add photo

        <input
            type="file"
            id="fileInput"
            accept="image/*"
        >

    </label>

    <a
        href="index.html"
        class="button"
    >
        ⟡ home
    </a>

</div>


<!-- GALLERY -->

<div
    class="gallery"
    id="gallery"
>

    <!--
    ТУТ МОЖНО ДОБАВЛЯТЬ СТАРЫЕ ФОТО

    пример:

    <div class="photo">

        <img
            src="photo1.jpg"
            alt="memory"
        >

        <button
            class="delete"
            onclick="deleteLocalPhoto(event,this)"
        >
            ×
        </button>

    </div>

    -->

</div>


<div
    class="empty"
    id="empty"
>
    our memories will live here ♡
</div>


<!-- FULLSCREEN VIEWER -->

<div
    class="viewer"
    id="viewer"
>

    <button
        class="close"
        onclick="closeViewer()"
    >
        ×
    </button>

    <img
        id="viewerImage"
        src=""
        alt=""
    >

</div>


<!-- LOADING -->

<div
    class="loading"
    id="loading"
>
    uploading... ♡
</div>


<script>


/* =========================
   ELEMENTS
========================= */

const fileInput =
    document.getElementById("fileInput");

const gallery =
    document.getElementById("gallery");

const empty =
    document.getElementById("empty");

const viewer =
    document.getElementById("viewer");

const viewerImage =
    document.getElementById("viewerImage");

const loading =
    document.getElementById("loading");


/* =========================
   UPDATE EMPTY MESSAGE
========================= */

function updateEmpty(){

    if(gallery.children.length === 0){

        empty.style.display = "block";

    }else{

        empty.style.display = "none";

    }

}


/* =========================
   ADD PHOTO TO GALLERY
========================= */

function addPhotoToGallery(url,fileId){

    const div =
        document.createElement("div");

    div.className = "photo";

    /*
       Сохраняем ImageKit fileId.
       Он понадобится позже для настоящего
       удаления файла из ImageKit.
    */

    div.dataset.fileId =
        fileId || "";


    div.innerHTML = `

        <img
            src="${url}"
            alt="memory"
        >

        <button
            class="delete"
            type="button"
        >
            ×
        </button>

    `;


    const image =
        div.querySelector("img");

    const deleteButton =
        div.querySelector(".delete");


    /* OPEN PHOTO */

    image.addEventListener(
        "click",
        function(){

            viewerImage.src =
                image.src;

            viewer.classList.add(
                "active"
            );

        }
    );


    /* DELETE */

    deleteButton.addEventListener(
        "click",
        function(event){

            event.stopPropagation();

            deletePhoto(div);

        }
    );


    gallery.prepend(div);

    updateEmpty();

}


/* =========================
   DELETE PHOTO
========================= */

function deletePhoto(photo){

    const fileId =
        photo.dataset.fileId;


    /*
       Сейчас удаляем фотографию
       из самой галереи.

       Позже подключим /api/delete,
       чтобы она удалялась и из ImageKit.
    */

    const ok =
        confirm(
            "Удалить это фото из галереи?"
        );


    if(!ok){

        return;

    }


    photo.remove();

    updateEmpty();

}


/* =========================
   UPLOAD PHOTO
========================= */

fileInput.addEventListener(
    "change",
    async function(){

        const file =
            fileInput.files[0];


        if(!file){

            return;

        }


        try{

            loading.classList.add(
                "active"
            );


            /*
               ПОЛУЧАЕМ АВТОРИЗАЦИЮ
               С НАШЕГО VERCEL API
            */

            const authResponse =
                await fetch(
                    "/api/auth"
                );


            if(!authResponse.ok){

                throw new Error(
                    "Не удалось получить авторизацию"
                );

            }


            const auth =
                await authResponse.json();


            if(
                !auth.token ||
                !auth.signature ||
                !auth.expire ||
                !auth.publicKey
            ){

                throw new Error(
                    "Авторизация ImageKit получена неправильно"
                );

            }


            /*
               СОЗДАЁМ FORMDATA
            */

            const formData =
                new FormData();


            formData.append(
                "file",
                file
            );


            formData.append(
                "fileName",
                file.name
            );


            formData.append(
                "publicKey",
                auth.publicKey
            );


            formData.append(
                "token",
                auth.token
            );


            formData.append(
                "expire",
                auth.expire
            );


            formData.append(
                "signature",
                auth.signature
            );


            /*
               ПАПКА В IMAGEKIT
            */

            formData.append(
                "folder",
                "/our-little-universe"
            );


            /*
               ОТПРАВЛЯЕМ В IMAGEKIT
            */

            const response =
                await fetch(
                    "https://upload.imagekit.io/api/v1/files/upload",
                    {
                        method:"POST",
                        body:formData
                    }
                );


            const result =
                await response.json();


            console.log(
                "ImageKit response:",
                result
            );


            if(!response.ok){

                throw new Error(
                    result.message ||
                    "ImageKit не принял фотографию"
                );

            }


            /*
               ДОБАВЛЯЕМ ФОТО
               НА СТРАНИЦУ
            */

            addPhotoToGallery(
                result.url,
                result.fileId
            );


            alert(
                "Фото добавлено ♡"
            );


        }catch(error){

            console.error(
                "UPLOAD ERROR:",
                error
            );


            alert(
                "Не получилось загрузить фото:\n\n"
                + error.message
            );


        }finally{

            loading.classList.remove(
                "active"
            );


            /*
               Чтобы можно было выбрать
               тот же файл ещё раз.
            */

            fileInput.value = "";

        }

    }
);


/* =========================
   VIEWER
========================= */

function closeViewer(){

    viewer.classList.remove(
        "active"
    );

    viewerImage.src = "";

}


/* Закрытие при нажатии
   вне фотографии */

viewer.addEventListener(
    "click",
    function(event){

        if(
            event.target === viewer
        ){

            closeViewer();

        }

    }
);


/* ESC */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            closeViewer();

        }

    }
);


/* =========================
   START
========================= */

updateEmpty();


</script>


</body>

  </html>
