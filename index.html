<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>our little universe</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
font-family:'Cormorant Garamond',serif;

background:url("03d713769f2fbfa58103415ec97e6b62.jpg") center center/cover no-repeat fixed;

color:white;

}

body::before{

content:"";
position:absolute;
inset:0;

background:
linear-gradient(
rgba(0,0,0,.45),
rgba(0,0,0,.65)
);

backdrop-filter:blur(2px);

}

.stars{

position:absolute;
inset:0;
pointer-events:none;

}

.stars span{

position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
opacity:.8;

animation:twinkle 4s infinite;

}

.stars span:nth-child(1){top:8%;left:12%;}
.stars span:nth-child(2){top:22%;left:70%;}
.stars span:nth-child(3){top:18%;left:45%;}
.stars span:nth-child(4){top:30%;left:83%;}
.stars span:nth-child(5){top:55%;left:15%;}
.stars span:nth-child(6){top:72%;left:30%;}
.stars span:nth-child(7){top:80%;left:80%;}
.stars span:nth-child(8){top:65%;left:60%;}
.stars span:nth-child(9){top:40%;left:55%;}
.stars span:nth-child(10){top:12%;left:90%;}

@keyframes twinkle{

0%{
opacity:.2;
transform:scale(.8);
}

50%{
opacity:1;
transform:scale(1.6);
}

100%{
opacity:.2;
transform:scale(.8);
}

}

.container{

position:relative;
z-index:2;

text-align:center;

animation:fade 2s ease;

padding:25px;

}

h1{

font-size:74px;

font-weight:600;

letter-spacing:4px;

line-height:78px;

text-shadow:

0 0 10px rgba(255,255,255,.15),

0 0 30px rgba(255,255,255,.08);

margin-bottom:24px;

}

.quote{

font-size:24px;

opacity:.85;

line-height:40px;

margin-bottom:38px;

font-style:italic;

}

.date{

font-size:30px;

letter-spacing:2px;

margin-bottom:65px;

opacity:.95;

}
.button{

display:inline-block;

padding:18px 58px;

border:1px solid rgba(255,255,255,.65);

border-radius:999px;

text-decoration:none;

color:white;

font-size:25px;

letter-spacing:3px;

backdrop-filter:blur(12px);

background:rgba(255,255,255,.05);

transition:.45s;

box-shadow:

0 0 20px rgba(255,255,255,.05);

}

.button:hover{

background:rgba(255,255,255,.16);

transform:translateY(-5px) scale(1.03);

box-shadow:

0 0 35px rgba(255,255,255,.18);

}

@keyframes fade{

from{

opacity:0;

transform:translateY(45px);

}

to{

opacity:1;

transform:translateY(0);

}

}

.fog{

position:absolute;

width:160%;

height:160%;

background:radial-gradient(circle,
rgba(255,255,255,.05),
transparent 70%);

animation:fog 26s linear infinite;

pointer-events:none;

}

@keyframes fog{

0%{

transform:translate(-15%,-10%) rotate(0deg);

}

100%{

transform:translate(10%,5%) rotate(360deg);

}

}

@media(max-width:700px){

h1{

font-size:50px;

line-height:55px;

}

.quote{

font-size:19px;

line-height:32px;

}

.date{

font-size:22px;

}

.buttons{
display:flex;
justify-content:center;
gap:18px;
flex-wrap:wrap;
}
  
.button{

font-size:21px;

padding:16px 46px;

}

}

</style>

</head>

<body>

<div class="fog"></div>

<div class="stars">

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

</div>

<div class="container">

<h1>

our little<br>
universe

</h1>

<p class="quote">

every day with you<br>

becomes another memory.

</p>

<div class="date">

7 August 2026

</div>

<div class="buttons">

<a href="diary.html" class="button">
⟡ diary ⟡
</a>

<a href="gallery.html" class="button">
✦ gallery ✦
</a>

</div>

</div>
<script>

const button = document.querySelector(".button");

button.addEventListener("mouseenter",()=>{

button.style.letterSpacing="5px";

});

button.addEventListener("mouseleave",()=>{

button.style.letterSpacing="3px";

});

</script>

</body>

</html>
